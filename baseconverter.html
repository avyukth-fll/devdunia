<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Converter - Developer Toolkit | DevDunia</title>
<meta name="description" content="Convert numbers from any base to any other base. Free online base converter tool for developers.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/common.js"></script>
<style>
body {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
}
</style>
</head>
<body class="h-screen lg:ml-72">
<div class="fixed inset-0 -z-10 bg-gradient-to-br from-gray-900 via-slate-900 to-gray-900"></div>
<div id="sidebar-container"></div>
<div class="main-content">
<div class="relative z-10 container mx-auto px-4 pt-16 pb-24 sm:px-6 lg:px-8">
<div class="text-center mb-12">
<h1 class="text-3xl sm:text-4xl font-bold mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-500">Base Converter</h1>
<p class="text-lg text-gray-400 max-w-2xl mx-auto">Convert numbers from any base to any other base.</p>
</div>
<div class="max-w-4xl mx-auto">
<div class="bg-slate-800/70 backdrop-blur-md rounded-lg shadow-lg border border-slate-700/60 p-6">
<div class="mb-6">
<label for="input-number" class="block text-sm font-medium text-gray-300 mb-2">Input Number</label>
<input type="text" id="input-number" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm" placeholder="Enter number to convert...">
</div>
<div class="mb-6 grid grid-cols-2 gap-4">
<div>
<label for="input-base" class="block text-sm font-medium text-gray-300 mb-2">Input Base</label>
<input type="number" id="input-base" min="2" max="36" value="10" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm">
</div>
<div>
<label for="output-base" class="block text-sm font-medium text-gray-300 mb-2">Output Base</label>
<input type="number" id="output-base" min="2" max="36" value="2" class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm">
</div>
</div>
<div class="flex flex-wrap gap-3 mb-6">
<button id="convert-btn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors duration-200 flex items-center space-x-2">
<span>Convert</span>
</button>
<button id="clear-btn" class="px-6 py-3 bg-slate-600 hover:bg-slate-700 text-white font-medium rounded-lg transition-colors duration-200 flex items-center space-x-2">
<span>Clear</span>
</button>
</div>
<div id="error-display" class="hidden mb-6 p-4 bg-red-900/50 border border-red-600/50 rounded-lg">
<div class="flex items-center space-x-2">
<span id="error-message" class="text-red-300"></span>
</div>
</div>
<div id="output-section" class="hidden">
<label for="output-number" class="block text-sm font-medium text-gray-300 mb-2">Converted Result</label>
<div class="relative">
<input type="text" id="output-number" readonly class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm">
<button class="copy-btn absolute top-2 right-2 px-3 py-1 bg-slate-600 hover:bg-slate-700 text-white text-sm rounded transition-colors duration-200 flex items-center space-x-1" data-target="output-number">
<span>Copy</span>
</button>
</div>
<div class="mt-3 flex flex-wrap gap-4 text-sm text-gray-400">
<div class="flex items-center space-x-2">
<span>Input Base:</span>
<span id="display-input-base" class="text-blue-400 font-medium"></span>
</div>
<div class="flex items-center space-x-2">
<span>Output Base:</span>
<span id="display-output-base" class="text-green-400 font-medium"></span>
</div>
</div>
</div>
</div>
</div>
</div>
<footer class="text-center text-gray-500 mt-10 pb-6">© 2025 DevDunia – Free Developer Tools by <a href="https://echobash.com" class="text-blue-500 hover:underline" target="_blank">echobash</a></footer>
</div>
<script src="sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const inputNumber=document.getElementById('input-number');
const inputBase=document.getElementById('input-base');
const outputBase=document.getElementById('output-base');
const convertBtn=document.getElementById('convert-btn');
const clearBtn=document.getElementById('clear-btn');
const outputSection=document.getElementById('output-section');
const outputNumber=document.getElementById('output-number');
const errorDisplay=document.getElementById('error-display');
const errorMessage=document.getElementById('error-message');
const displayInputBase=document.getElementById('display-input-base');
const displayOutputBase=document.getElementById('display-output-base');
convertBtn.addEventListener('click',()=>{
const numStr=inputNumber.value.trim();
const inBase=parseInt(inputBase.value);
const outBase=parseInt(outputBase.value);
if(!numStr||isNaN(inBase)||isNaN(outBase)||inBase<2||inBase>36||outBase<2||outBase>36){
errorMessage.textContent='Please enter valid number and bases between 2 and 36';
errorDisplay.classList.remove('hidden');
outputSection.classList.add('hidden');
return;
}
try{
const decimal=parseInt(numStr,inBase);
if(isNaN(decimal))throw new Error('Invalid number for input base');
const converted=decimal.toString(outBase).toUpperCase();
outputNumber.value=converted;
displayInputBase.textContent=inBase;
displayOutputBase.textContent=outBase;
outputSection.classList.remove('hidden');
errorDisplay.classList.add('hidden');
}catch(e){
errorMessage.textContent='Error converting number: '+e.message;
errorDisplay.classList.remove('hidden');
outputSection.classList.add('hidden');
}
});
clearBtn.addEventListener('click',()=>{
inputNumber.value='';
inputBase.value='10';
outputBase.value='2';
outputSection.classList.add('hidden');
errorDisplay.classList.add('hidden');
});
});
</script>
<script>
fetch('final_sidebar.html').then(r=>r.text()).then(html=>document.getElementById('sidebar-container').innerHTML=html).catch(err=>console.error('Error loading sidebar:',err));
</script>
</body>
</html>
